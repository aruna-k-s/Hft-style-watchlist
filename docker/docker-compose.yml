version: '3.8'

services:
  # C++ Tick Ingestion Engine
  ingestion-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpp
    container_name: hft-ingestion-engine
    ports:
      - "5555:5555"
    environment:
      - TZ=UTC
      - DATA_SOURCE=${DATA_SOURCE:-simulated}
      - UPSTOX_BRIDGE_ENDPOINT=${UPSTOX_BRIDGE_ENDPOINT:-tcp://python-bridge:5556}
    restart: unless-stopped
    networks:
      - hft-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5555"]
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      - "component=ingestion"
      - "service=zmq-publisher"

  # Python bridge for Upstox real-time market data
  python-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: hft-python-bridge
    environment:
      - TZ=UTC
      - DATA_SOURCE=upstox
      - UPSTOX_BRIDGE_ENDPOINT=tcp://0.0.0.0:5556
    restart: unless-stopped
    networks:
      - hft-network
    command: ["python", "/app/python_bridge/upstox_bridge.py"]
    labels:
      - "component=bridge"
      - "service=upstox-bridge"

  # Python Signal Processing Engine
  signal-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: hft-signal-engine
    environment:
      - TZ=UTC
    depends_on:
      ingestion-engine:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hft-network
    volumes:
      - ./watchlist_output:/app/output
    labels:
      - "component=processing"
      - "service=signal-engine"

networks:
  hft-network:
    driver: bridge

volumes:
  watchlist_output:
